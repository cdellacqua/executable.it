server {
  server_name executable.it;
  root /var/www/executable.it;
  return 301 https://www.executable.it$request_uri;
}

server {
  server_name www.executable.it;
  root /var/www/executable.it/public;
  expires 5d;
  index index.html;


  error_page 404 /404.html;
  location ~ '^/(404)\.html$' {
  }

  location = / {
    return 301 /it;
  }

  location /api {
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		
		set $proxied 127.0.0.1:3001;
		proxy_pass http://$proxied;
  }

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
}